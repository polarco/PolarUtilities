name: Feature request
description: Suggest an improvement or new utility.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What should this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Extra details
      description: Commands, permissions, config options or examples.
